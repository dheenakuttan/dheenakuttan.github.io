<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1d33">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Garment Printing Machinery Catalogue</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1a1d33;--mute:#5d6177;--line:#dedcd3;--c:#0096b7;--m:#d6126f;--y:#f2b705;--btn:#1a1d33;--btnt:#fff;--wa:#128c4a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14162a;--card:#1d2038;--ink:#f1f0ea;--mute:#a4a8c0;--line:#33375a;--c:#2ec4e6;--m:#ff4f9d;--y:#ffd23f;--btn:#f1f0ea;--btnt:#14162a;--wa:#2fbf71}}
:root[data-theme="dark"]{--bg:#14162a;--card:#1d2038;--ink:#f1f0ea;--mute:#a4a8c0;--line:#33375a;--c:#2ec4e6;--m:#ff4f9d;--y:#ffd23f;--btn:#f1f0ea;--btnt:#14162a;--wa:#2fbf71}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 40px}
header{padding:20px 0 12px}
.brand{display:flex;align-items:center;gap:12px}
.reg{width:40px;height:40px;flex:none}
h1{font:700 1.25rem/1.2 Georgia,"Times New Roman",serif;margin:0}
.sub{margin:2px 0 0;color:var(--mute);font-size:.875rem}
.bar{display:flex;height:4px;margin:14px 0}
.bar i{flex:1}
input[type=search]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{flex:none;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:inherit;font-size:.875rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;overflow:hidden}
.card svg{display:block;width:100%;height:auto}
.cb{padding:10px 12px 12px}
.cat{font-size:.75rem;color:var(--mute)}
.nm{font-weight:600;font-size:.9375rem;line-height:1.3;margin:2px 0 6px}
.pr{font-weight:700;color:var(--m)}
.empty{grid-column:1/-1;padding:32px 0;text-align:center;color:var(--mute)}
.sheet{position:fixed;inset:0;background:rgba(10,12,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.panel{background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.panel h2{font:700 1.375rem/1.25 Georgia,serif;margin:12px 0 4px}
.close{float:right;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.9375rem}
td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--mute);width:42%;padding-right:8px}
.act{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.b{display:block;text-align:center;text-decoration:none;padding:13px;border-radius:10px;font-weight:600}
.wa{background:var(--wa);color:#fff}
.call{border:1.5px solid var(--btn);color:var(--ink)}
.note{margin-top:20px;color:var(--mute);font-size:.8125rem}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <svg class="reg" viewBox="0 0 40 40" fill="none" stroke-width="2" aria-hidden="true"><circle cx="20" cy="20" r="11" stroke="#0096b7"/><circle cx="20" cy="20" r="5" stroke="#d6126f"/><path d="M20 2v10M20 28v10M2 20h10M28 20h10" stroke="#f2b705"/></svg>
    <div><h1 id="biz"></h1><p class="sub">Garment printing machinery</p></div>
  </div>
  <div class="bar" aria-hidden="true"><i style="background:#0096b7"></i><i style="background:#d6126f"></i><i style="background:#f2b705"></i><i style="background:#1a1d33"></i></div>
  <input type="search" id="q" placeholder="Search machines" aria-label="Search machines">
  <div class="chips" id="chips" role="group" aria-label="Categories"></div>
</header>
<main><div class="grid" id="grid"></div>
<p class="note">Sample products and prices. Replace with your own details.</p></main>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Machine details"><div class="panel" id="panel"></div></div>
<script>
const BIZ="Your Business Name", WA="919999999999", PHONE="+919999999999";
const COLORS={"DTG Printers":"#0096b7","Screen Printing":"#d6126f","Heat Press":"#f2b705","Dryers":"#6b5bd6","Embroidery":"#1f9d6b"};
const P=[
{n:"A3 DTG Printer",c:"DTG Printers",p:450000,s:{"Print area":"29 × 42 cm","Inks":"CMYK + White","Best for":"Cotton T-shirts, small batches","Power":"220V, single phase","Warranty":"1 year"}},
{n:"A4 DTG Printer",c:"DTG Printers",p:285000,s:{"Print area":"21 × 29 cm","Inks":"CMYK + White","Best for":"Starter setup, custom orders","Power":"220V, single phase","Warranty":"1 year"}},
{n:"6 Colour 6 Station Screen Printing Machine",c:"Screen Printing",p:65000,s:{"Type":"Manual carousel","Stations":"6 colours, 6 stations","Frame size":"23 × 31 in","Best for":"Bulk T-shirt printing","Warranty":"1 year"}},
{n:"Automatic 4 Colour Screen Printing Machine",c:"Screen Printing",p:185000,s:{"Type":"Automatic carousel","Colours":"4","Output":"Up to 400 pcs/hour","Power":"3 phase","Warranty":"1 year"}},
{n:"Heat Press 15 × 15 in",c:"Heat Press",p:9500,s:{"Plate size":"15 × 15 in","Temperature":"Up to 250 °C","Timer":"Digital","Use":"Transfers, vinyl, sublimation","Warranty":"6 months"}},
{n:"Flash Cure Dryer",c:"Dryers",p:24000,s:{"Plate size":"16 × 20 in","Heating":"Infrared","Control":"Digital temperature","Use":"Between colours on screen printing","Warranty":"1 year"}},
{n:"Conveyor Tunnel Dryer",c:"Dryers",p:120000,s:{"Belt width":"24 in","Heating":"Electric, 6 kW","Control":"Speed and temperature","Use":"Plastisol and water-based inks","Warranty":"1 year"}},
{n:"Single Head Embroidery Machine",c:"Embroidery",p:210000,s:{"Heads":"1","Needles":"15","Speed":"Up to 1000 rpm","Embroidery area":"40 × 40 cm","Warranty":"1 year"}}
];
const inr=v=>"₹"+new Intl.NumberFormat("en-IN").format(v);
const $=id=>document.getElementById(id);
let cat="All";
$("biz").textContent=BIZ;
function art(c){const k=COLORS[c];return `<svg viewBox="0 0 200 120" aria-hidden="true"><rect width="200" height="120" fill="${k}" opacity=".16"/><rect x="40" y="62" width="120" height="30" rx="4" fill="${k}"/><rect x="58" y="34" width="84" height="28" rx="3" fill="${k}" opacity=".6"/><rect x="30" y="92" width="140" height="6" fill="${k}" opacity=".85"/><circle cx="150" cy="77" r="5" fill="#fff"/></svg>`}
function chips(){const cs=["All",...Object.keys(COLORS)];$("chips").innerHTML=cs.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("")}
function list(){const t=$("q").value.trim().toLowerCase();
const r=P.map((x,i)=>({...x,i})).filter(x=>(cat==="All"||x.c===cat)&&(x.n+" "+x.c).toLowerCase().includes(t));
$("grid").innerHTML=r.length?r.map(x=>`<button class="card" data-i="${x.i}">${art(x.c)}<div class="cb"><div class="cat">${x.c}</div><div class="nm">${x.n}</div><div class="pr">${inr(x.p)}</div></div></button>`).join(""):`<div class="empty">No machines found. Try another name or category.</div>`}
function open(i){const x=P[i];
const msg=encodeURIComponent(`Hello, I’m interested in the ${x.n}. Please share the best price and details.`);
$("panel").innerHTML=`<button class="close" id="cl">Close</button>${art(x.c)}<h2>${x.n}</h2><div class="pr" style="font-size:1.125rem">${inr(x.p)}</div><table>${Object.entries(x.s).map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join("")}</table><div class="act"><a class="b wa" href="https://wa.me/${WA}?text=${msg}" target="_blank" rel="noopener">WhatsApp enquiry</a><a class="b call" href="tel:${PHONE}">Call now</a></div>`;
$("sheet").classList.add("on");$("cl").focus()}
function close(){$("sheet").classList.remove("on")}
$("chips").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(!b)return;cat=b.dataset.c;chips();list()});
$("grid").addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(b)open(+b.dataset.i)});
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet"||e.target.id==="cl")close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
$("q").addEventListener("input",list);
chips();list();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
